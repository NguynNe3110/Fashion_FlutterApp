name: fashion

packages:
  - app
  - shared
  - domain
  - data
  - initializer
  - resources

# Dart Workspaces tự link các package trong monorepo.
# Không cần melos bootstrap nữa - dùng `flutter pub get` ở root là đủ.
# Bỏ script 'bootstrap' vì nó gây vòng lặp và tự sinh pubspec_overrides.yaml.

scripts:
  pubget:
    run: melos exec --no-private -- flutter pub get
    description: Run flutter pub get in all packages

  build:
    run: melos exec -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in all packages

  analyze:
    run: melos exec -- dart analyze
    description: Run dart analyze in all packages

  clean:
    run: melos exec -- flutter clean
    description: Clean all packages

  setup:
    run: melos pubget && melos build
    description: Full setup - install deps and build
