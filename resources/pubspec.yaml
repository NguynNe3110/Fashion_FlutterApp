name: resources
description: A starting point for Dart libraries or applications.
version: 1.0.0
resolution: workspace

environment:
    sdk: ">=3.9.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter
    intl: ^0.20.0

dev_dependencies:
    lints: ^5.0.0

flutter:
    generate: true

flutter_intl:
    enabled: true
    class_name: S
    main_locale: en
    arb_dir: lib/src/l10n
    output_dir: lib/src/generated
